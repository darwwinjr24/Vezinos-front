<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <!-- <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no"> -->
  <title>Vezinos/registrar</title>
  <link rel="shortcut icon" href="../../images/Logo.png" />
</head>

<body>
  <div class="row w-100 mx-0">
    <div class="col-lg-4 mx-auto">
      <div class="auth-form-light text-center py-5 px-2 px-sm-5">
        <div class="brand-logo">
          <img src="/template/images/Logo1.png" alt="logo" style="width:200px; height:auto;">
        </div>
        <h4>Eres nuevo aquí?</h4>
        <h6 class="font-weight-light"> No te preocupes, solo son unos cuantos pasos</h6>
        <form class="pt-3" id="registro">
          <div class="form-group">
            <div class="form-group">
              <input type="number" class="form-control form-control-lg" id="" name="numero_documento"
                placeholder="Número del documento" required>
            </div>
            <input type="text" class="form-control form-control-lg mt-3" id="" name="nombre_usuario"
              placeholder="Nombre de usuario" required>
          </div>
          <div class="form-group">
            <input type="text" class="form-control form-control-lg" id="" name="nombre_completo"
              placeholder="Nombre completo" required>
          </div>
          <div class="form-group">
            <input type="email" class="form-control form-control-lg" id="" name="correo"
              placeholder="Correo Electrónico" required>
          </div>
          <div class="text-left">
            <h6>Seleccione su Rol</h6>
          </div>
          <div class="form-group">
            <select id="rol" class="form-control form-control-lg" name="rol" required>
              <option value="administrador">Administrador</option>
              <option value="porteria">Portería</option>
              <option value="residente">Residente</option>
            </select>
          </div>
          <div class="form-group">
            <input type="number" id="codigo" class="form-control form-control-lg" placeholder="Código de activación"
              name="codigo_activacion" required>
          </div>
          <div class="text-left">
            <h6>Seleccione su Conjunto</h6>
          </div>
          <div class="form-group">
            <select class="form-control form-control-lg" id="exampleFormControlSelect2" name="conjunto" required>
              <option>Conjunto Palmetto</option>
              <option>Conjunto Trapiches</option>
              <option>Conjunto Torres del Este</option>
              <option>Conjunto Caoba</option>
              <option>Conjunto Tulipanes</option>
              <option>Conjunto Arkadia</option>
            </select>
          </div>
          <div class="form-group">
            <input type="password" class="form-control form-control-lg" id="exampleInputPassword1"
              placeholder="Escriba una contraseña" name="contrasena" required>
          </div>
          <div class="form-group">
            <input type="password" class="form-control form-control-lg" id="exampleInputPassword1"
              placeholder="Confirme su contraseña" name="confirmacion" required>
          </div>
          <div class="mb-4">
            <div class="form-check">
              <input type="checkbox" class="form-check-input" id="acepto" required>
              Acépto términos y condiciones
              </label>
            </div>
            <a href="https://1drv.ms/b/c/10a4bec8c214ff40/IQAhRMb4IK0JT59xU29vfugGAaAN3fCiKvSCBGNKTjV2zuU?e=WM8Qcv">Términos
              y condiciones</a>
          </div>
          <div class="mt-3">
            <button type="submit" id="btn-guardar" class="btn btn-primary btn-block">REGISTRAR</button>
          </div>
          <div class="text-center mt-4 font-weight-light">
            Ya tienes una cuenta? <a href="#" onclick="cargarVista('pages/samples/login')" class="text-primary">Inicia
              sesión</a>
          </div>
        </form>
        <div id="mensaje"></div>
      </div>
    </div>
  </div>
  </div>
  </div>
  </div>
  <script src="../../app.js"></script>
</body>

<style>
  .btn-plateado {
    background-color: #C0C0C0;
    color: #000;
    /* texto negro para contraste */
  }

  .btn-plateado:hover {
    background-color: #999999;
  }

  input:disabled {
    background-color: #e9ecef;
    cursor: not-allowed;
  }
</style>

</html>
