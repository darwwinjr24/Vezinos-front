<!DOCTYPE html>
<html lang="es">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>www.vezinosadmin.com.co</title>
    <!-- base:css -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="vendors/typicons.font/font/typicons.css">
    <link rel="stylesheet" href="vendors/css/vendor.bundle.base.css">
    <!-- endinject -->
    <!-- plugin css for this page -->
    <!-- End plugin css for this page -->
    <!-- inject:css -->
    <link rel="stylesheet" href="css/vertical-layout-light/style.css">
    <!-- endinject -->
    <link rel="shortcut icon" href="images/Logo.png" />
</head>

<body>
    <div class="main-panel">
        <div class="content-wrapper">
            <div class="row">
                <div class="col-sm-6">
                    <a><img src="images/conj4.png"
                            style="height: 100px;; width:auto;display:inline-block; vertical-align:middle;" /></a>
                    <h3 class="mb-0 font-weight-bold" style="margin-top: 1cm;">Conjunto Trapiches</h3>
                    <p>Calle 25 # 2-90</p>
                </div>
            </div>
            <div class="container-fluid" ;>
                <div class="formulario">
                    <h2>Registra los vehículos</h2>

                    <!-- Input de opción (select) -->
                    <label for="rol">Seleccione la vivienda</label>
                    <select id="rol" name="rol">
                        <option value="residente">1</option>
                        <option value="visitante">2</option>
                        <option value="visitante">3</option>
                    </select>

                    <label for="rol">Tipo de vehículo</label>
                    <select id="rol" name="rol">
                        <option value="residente">Seleccione</option>
                        <option value="visitante">Moto</option>
                        <option value="visitante">Carro</option>
                    </select>
                       <div>
                            <label for="edad">Marca</label>
                            <input type="text" id="edad" name="edad" placeholder="Ej: Chevrolet">
                        </div>
                    <div class="numero2">
                        <div>
                            <label for="edad">Placa</label>
                            <input type="text" id="edad" name="edad" placeholder="Ej: ABC 678">
                        </div>
                         <div>
                            <label for="edad">Linea</label>
                            <input type="text" id="edad" name="edad" placeholder="Ej: Chevrolet">
                        </div>
                        <div>
                            <label for="edad">Color</label>
                            <input type="text" id="edad" name="edad" placeholder="Ej: Rojo">
                        </div>
                    </div>
                    <!-- Botón -->
                    <div class="botones">
                        <button type="submit" class="btn-azul"
                            onclick="document.getElementById('qrModal').style.display='block'">Registrar</button>
                        <button type="submit" class="btn-plateado">Cancelar</button>



                        <!-- Modal -->
                        <div id="qrModal" class="modal">
                            <div class="modal-content">
                                <span class="close"
                                    onclick="document.getElementById('qrModal').style.display='none'">&times;</span>
                                <h3>Este es tu código de visitante</h3>
                                <!-- Aquí colocas tu imagen de QR ya generada -->
                                <img src="../template/images/QR.png" alt="Código QR">
                                <br><br>
                                <!-- Botón para descargar -->
                                <a href="qr-visitante.png" download="codigoQR.png">
                                    <button class="btn-azul">Descargar QR</button>
                                </a>
                                <!-- Botón para compartir (abre WhatsApp como ejemplo) -->
                                <!-- <a href="https://wa.me/?text=Tu%20código%20QR%20de%20acceso%20https://tuservidor.com/qr-visitante.png"
                                            target="_blank"> -->
                                <button class="btn btn-block btn-wasa auth-form-btn"
                                    onclick="window.open('https://wa.me/?text=Tu%20código%20QR%20de%20acceso','_blank')">
                                    <i class="fab fa-whatsapp mr-2"></i>Compartir
                                    por WhatsApp</button>
                                </a>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </div>
    <!-- container-scroller -->
    <!-- base:js -->
    <script src="vendors/js/vendor.bundle.base.js"></script>
    <!-- endinject -->
    <!-- Plugin js for this page-->
    <!-- End plugin js for this page-->
    <!-- inject:js -->
    <script src="js/off-canvas.js"></script>
    <script src="js/hoverable-collapse.js"></script>
    <script src="js/template.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/todolist.js"></script>
    <!-- endinject -->
    <!-- plugin js for this page -->
    <script src="vendors/progressbar.js/progressbar.min.js"></script>
    <script src="vendors/chart.js/Chart.min.js"></script>
    <!-- End plugin js for this page -->
    <!-- Custom js for this page-->
    <script src="js/dashboard.js"></script>
    <!-- End custom js for this page-->
</body>
<style>
    .formulario {
        background-color: #ffffff;
        /* fondo blanco */
        padding: 40px;
        border-radius: 15px;
        width: 60%;
        max-width: 900px;
        /* límite máximo */
        margin: 50px auto;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .formulario h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #007bff;
        margin-bottom: 2cm;
    }

    .formulario label {
        display: block;
        margin-top: 20px;
        font-weight: bold;
        margin-bottom: 2px;
        /* color: #007bff; */
    }

    .formulario input,
    .formulario select {
        width: 100%;
        padding: 8px;
        margin-top: 0;
        border: 1px solid #ccc;
        border-radius: 10px;
    }

    .formulario .opciones {
        margin-top: 20px;
    }

    .formulario button {
        margin-top: 20px;
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    .btn-plateado {
        background-color: #C0C0C0;
        color: #000;
        /* texto negro para contraste */
    }

    .btn-azul {
        background-color: #007bff;
        color: #fcf9f9;
    }

    .formulario .btn-azul:hover {
        background-color: #0056b3;
    }

    .formulario .btn-plateado:hover {
        background-color: #999999;
    }

    .botones {
        display: flex;
        /* coloca las opciones en línea */
        gap: 20px;
        /* espacio entre Hombre y Mujer */
        align-items: center;
        /* alinea verticalmente */
        margin-top: 50px;

    }

    .numero {
        display: flex;
        /* coloca las opciones en línea */
        gap: 5px;
        /* espacio entre lineas */
        align-items: center;
        /* alinea verticalmente */
        gap: 30px;
        /* espacio entre columnas */
        margin-top: 30px;
    }

    .numero2 {
        gap: 5px;
        /* espacio entre lineas */
        align-items: center;
        /* alinea verticalmente */
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        /* 3 columnas iguales */
        gap: 20px;
        /* espacio entre columnas */
        margin-top: 30px;
    }

    /* Modal */
    .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.5);
    }

    .modal-content {
        background: #fff;
        margin: 10% auto;
        padding: 20px;
        border-radius: 10px;
        width: 300px;
        text-align: center;
    }

    .close {
        cursor: pointer;
        color: red;
        font-weight: bold;
        float: right;
    }

    img {
        max-width: 100%;
    }

    .btn-wasa {
        background-color: #25D366;
        /* verde oficial de WhatsApp */
        color: white;
        text-decoration: none;
        /* quita la línea */
    }

    .btn-wasa:hover {
        background-color: #1ebe57;
    }
</style>


</html>
