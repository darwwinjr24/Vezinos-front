<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>www.vezinosadmin.com.co</title>
    <!-- base:css -->
    <link rel="stylesheet" href="vendors/typicons.font/font/typicons.css">
    <link rel="stylesheet" href="vendors/css/vendor.bundle.base.css">
    <link rel="stylesheet" href="css/vertical-layout-light/style.css">
    <link rel="shortcut icon" href="../images/Logo.png" />
</head>

<body>
    <div class="main-panel">
        <div class="content-wrapper">
            <div class="row">
                <div class="col-sm-6">
                    <a><img src="../images/conj4.png"
                            style="height: 100px;; width:auto;display:inline-block; vertical-align:middle;" /></a>
                    <h3 class="mb-0 font-weight-bold" style="margin-top: 1cm;">Conjunto Trapiches</h3>
                    <p>Calle 25 # 2-90</p>
                </div>
            </div>
            <div class="container-fluid" ;>
                <div class="formulario">
                    <h2>Asociar Residentes</h2>

                                        <!-- Input de opción (select) -->
                    <label for="rol">Numero de Casa</label>
                    <select id="rol" name="rol">
                        <option value="residente">1</option>
                        <option value="visitante">2</option>
                        <option value="visitante">3</option>
                        <option value="visitante">4</option>
                        <option value="visitante">5</option>
                    </select>

                    <!-- Input de texto -->
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre">

                    <label for="edad">Edad</label>
                    <input type="number" id="edad" name="edad" placeholder="Ej: 88956417">

                    <!-- Input de opción (select) -->
                    <label for="rol">Sexo</label>
                    <select id="rol" name="rol">
                        <option value="residente">Masculino</option>
                        <option value="visitante">Femenino</option>
                    </select>

                    <!-- Botón -->
                    <div class="botones">
                        <button type="submit" class="btn-azul">Registrar</button>
                        <button type="submit" class="btn-plateado">Cancelar</button>
                    </div>

                </div>
            </div>
        </div>
    </div>
    </div>
    </div>
    <!-- base:js -->
    <script src="vendors/js/vendor.bundle.base.js"></script>
    <script src="js/off-canvas.js"></script>
    <script src="js/hoverable-collapse.js"></script>
    <script src="js/template.js"></script>
    <script src="js/settings.js"></script>
    <script src="js/todolist.js"></script>
    <script src="vendors/progressbar.js/progressbar.min.js"></script>
    <script src="vendors/chart.js/Chart.min.js"></script>
    <script src="js/dashboard.js"></script>
</body>

<style>
    .formulario {
        background-color: #ffffff;
        /* fondo blanco */
        padding: 40px;
        border-radius: 15px;
        width: 60%;
        max-width: 900px;
        /* límite máximo */
        margin: 50px auto;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        align-items: center;
    }

    .formulario h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #007bff;
        margin-bottom: 2cm;

    }

    .formulario label {
        display: block;
        margin-top: 20px;
        font-weight: bold;
        margin-bottom: 2px;
        /* color: #007bff; */
    }

    .formulario input,
    .formulario select {
        width: 100%;
        padding: 8px;
        margin-top: 0;
        border: 1px solid #ccc;
        border-radius: 10px;
    }

    .formulario .opciones {
        margin-top: 20px;
    }

    .formulario button {
        margin-top: 20px;
        width: 100%;
        padding: 10px;
        border: none;
        border-radius: 5px;
        cursor: pointer;
    }

    .formulario button:hover {
        background-color: #0056b3;
    }

    .numero {
        display: flex;
        /* coloca las opciones en línea */
        gap: 20px;
        /* espacio entre Hombre y Mujer */
        align-items: center;
        /* alinea verticalmente */
    }

    .btn-plateado {
        background-color: #C0C0C0;
        color: #000;
        /* texto negro para contraste */
    }

    .formulario .btn-plateado:hover {
        background-color: #999999;
    }

    .btn-azul {
        background-color: #007bff;
        color: #fcf9f9;
    }

    .formulario .btn-azul:hover {
        background-color: #0056b3;
    }

    .botones {
        display: flex;
        /* coloca las opciones en línea */
        gap: 20px;
        /* espacio entre Hombre y Mujer */

        align-items: center;
        /* alinea verticalmente */
    }
</style>

</html>
