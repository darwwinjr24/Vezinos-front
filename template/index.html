<!DOCTYPE html>
<html lang="es">

<head>
  <!-- linea para responsive en moviles -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- libreria de iconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <meta charset="utf-8">
  <title>www.vezinosadmin.com.co</title>
  <link rel="stylesheet" href="vendors/typicons.font/font/typicons.css">
  <link rel="stylesheet" href="vendors/css/vendor.bundle.base.css">
  <link rel="stylesheet" href="css/vertical-layout-light/style.css">
  <link rel="shortcut icon" href="images/Logo.png" />
  <!-- <link rel="stylesheet" href="app.js"> -->
</head>

<body>
  <div class="container-scroller">
    <header>
      <div class="logo">
        <a class="" href="index.html"><img src="images/logo3.png" style="height:auto; max-width: 100%;" /></a>
      </div>
      <p>Fortaleciendo la seguridad y convivencia en comunidades residenciales</p>
    </header>

    <nav>
      <ul>
        <li><a href="#" onclick="cargarVista('modulo_bienvenida/inicio')">Inicio</a></li>
        <li><a href="#" onclick="cargarVista('modulo_bienvenida/conocenos')">Conocenos</a></li>
        <li><a href="#" onclick="cargarVista('modulo_bienvenida/ayuda')">Ayuda</a></li>
        <li><a href="#" onclick="cargarVista('modulo_usuarios/ingresar')">Ingresar</a></li>
        <li><a href="#" onclick="cargarVista('modulo_usuarios/registrar', event)">Registrarse</a></li>
      </ul>
    </nav>
    <main id="contenido">
    </main>

    <script>
      async function cargarVista(vista) {
        const contenedor = document.getElementById("contenido");
        try {
          const respuesta = await fetch(vista + ".html");
          if (!respuesta.ok) throw new Error("No se pudo cargar la vista");
          const html = await respuesta.text();
          contenedor.innerHTML = html;
        } catch (error) {
          contenedor.innerHTML = "<p>Error cargando la vista: " + error.message + "</p>";
        }
      }
      // Cargar vista inicial al abrir la página
      cargarVista('modulo_bienvenida/inicio');
    </script>

    <footer class="mt-4">
      <h2 class="text-center">Te interesa?</h2>
      <h5 class="text-center">Contactanos, y se parte de esta gran comunidad, tus vecinos te lo agradecerán</h5>
      <div class="text-center">
        <a href="https://facebook.com" target="_blank" class="me-3">
          <i class="fab fa-facebook fa-2x"></i>
        </a>
        <a href="https://instagram.com" target="_blank" class="me-3">
          <i class="fab fa-instagram fa-2x"></i>
        </a>
        <a href="https://twitter.com" target="_blank" class="me-3">
          <i class="fab fa-twitter fa-2x"></i>
        </a>
        <a href="https://wa.me/573001234567" target="_blank">
          <i class="fab fa-whatsapp fa-2x"></i>
        </a>
      </div>
      <p class="mt-3">&copy; 2026 VEZINOS - Todos los derechos reservados</p>
    </footer>
  </div>

  <script src="vendors/js/vendor.bundle.base.js"></script>
  <script src="js/off-canvas.js"></script>
  <script src="js/hoverable-collapse.js"></script>
  <script src="js/template.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/todolist.js"></script>
  <script src="vendors/progressbar.js/progressbar.min.js"></script>
  <script src="vendors/chart.js/Chart.min.js"></script>
  <script src="app.js"></script>
</body>

<style>
  body {
    margin: 0;
    font-family: Arial, sans-serif;
  }

  header {
    background-color: #f6f7f8;
    color: #2c3e50;
    padding: 20px;
    text-align: center;
  }

  .header-container {
    display: flex;
    /* coloca los elementos en fila */
    align-items: center;
    /* centra verticalmente */
    justify-content: flex-start;
    /* alinea a la izquierda */
    gap: 20px;
    /* espacio entre elementos */
  }

  .logo img {
    max-height: 80px;
    max-width: 100%;
    /* ajusta tamaño del logo */
  }

  .text-block {
    flex: 1;
    text-align: center;
    /* centra el texto dentro del bloque */
  }

  .text-block h1 {
    margin: 0;
    font-size: 2em;
    color: #2c3e50;
  }

  .text-block p {
    margin: 5px 0 0;
    color: #2c3e50;
  }

  nav {
    background-color: #34495e;
  }

  nav ul {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
  }

  nav ul li {
    margin: 0 15px;
  }

  nav ul li a {
    color: white;
    text-decoration: none;
    padding: 10px;
    display: block;
  }

  nav ul li a:hover {
    background-color: #545756;
    border-radius: 5px;
  }

  footer {
    background-color: #2c3e50;
    color: white;
    text-align: center;
    padding: 15px;
  }
</style>

</html>
