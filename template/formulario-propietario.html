<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>www.vezinosadmin.com.co</title>
  <link rel="stylesheet" href="vendors/typicons.font/font/typicons.css">
  <link rel="stylesheet" href="vendors/css/vendor.bundle.base.css">
  <link rel="stylesheet" href="css/vertical-layout-light/style.css">
  <link rel="shortcut icon" href="images/Logo.png" />
</head>

<body>
  <div class="main-panel">
    <div class="content-wrapper">
      <div class="row">
        <div class="col-sm-6">
          <a><img src="images/conj4.png"
              style="height: 100px;; width:auto;display:inline-block; vertical-align:middle;" /></a>
          <h3 class="mb-0 font-weight-bold" style="margin-top: 1cm;">Conjunto Trapiches</h3>
          <p>Calle 25 # 2-90</p>
        </div>
      </div>
      <div class="container-fluid" ;>
        <form id="personas">
          <div class="formulario">
            <h2>Registrar propietario</h2>

            <!-- Input de texto -->
            
            <label for="">Numero de la cédula:</label>
            <input type="hidden" id="id_persona" name="id_persona">
            <input type="number" id="numero_cedula" placeholder="Ej: 88956417" name="numero_cedula">

            <label for="">Nombre completo:</label>
            <input type="text" id="nombre_completo" placeholder="Escribe tu nombre" name="nombre_completo">

            <label for="">Correo electrónico:</label>
            <input type="text" id="correo" placeholder="Ej: luismedina34@outlook.com" name="correo">

            <!-- Input numérico -->
            <label for="">Numero de Celular:</label>
            <input type="" id="celular" placeholder="Ej: 3108569300" name="celular">


            <label for="">Numero de la casa o apartamento:</label>
            <div class="numero">
              <input type="text" id="torre_manzana" name="torre_manzana" placeholder="Torre o Manzana">
              <input type="number" id="apartamento" name="apartamento" placeholder="Numero">
            </div>

            <!-- Input de opción (select) -->
            <label for="">Rol:</label>
            <select id="rol" name="rol">
              <option value="propietario">Propietario</option>
            </select>

            <label for="">Reside en el conjunto:</label>
            <select id="residente" name="residente">
              <option value="Si">Si</option>
              <option value="No">No</option>
            </select>

            <!-- Botón -->
            <div class="botones">
              <button type="submit" class="btn-azul">Registrar</button>
              <button type="reset" class="btn-plateado">Cancelar</button>
            </div>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="vendors/js/vendor.bundle.base.js"></script>
  <script src="js/off-canvas.js"></script>
  <script src="js/hoverable-collapse.js"></script>
  <script src="js/template.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/todolist.js"></script>
  <script src="vendors/progressbar.js/progressbar.min.js"></script>
  <script src="vendors/chart.js/Chart.min.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="app.js"></script>

</body>

<style>
  .formulario {
    background-color: #ffffff;
    /* fondo blanco */
    padding: 40px;
    border-radius: 15px;
    width: 60%;
    max-width: 900px;
    /* límite máximo */
    margin: 50px auto;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    align-items: center;
  }

  .formulario h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #007bff;
    margin-bottom: 2cm;

  }

  .formulario label {
    display: block;
    margin-top: 20px;
    font-weight: bold;
    margin-bottom: 2px;
    /* color: #007bff; */
  }

  .formulario input,
  .formulario select {
    width: 100%;
    padding: 8px;
    margin-top: 0;
    border: 1px solid #ccc;
    border-radius: 10px;
  }

  .formulario .opciones {
    margin-top: 20px;
  }

  .formulario button {
    margin-top: 20px;
    width: 100%;
    padding: 10px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }

  .formulario button:hover {
    background-color: #0056b3;
  }

  .numero {
    display: flex;
    /* coloca las opciones en línea */
    gap: 20px;
    /* espacio entre Hombre y Mujer */
    align-items: center;
    /* alinea verticalmente */
  }

  .btn-plateado {
    background-color: #C0C0C0;
    color: #000;
    /* texto negro para contraste */
  }

  .formulario .btn-plateado:hover {
    background-color: #999999;
  }

  .btn-azul {
    background-color: #007bff;
    color: #fcf9f9;
  }

  .formulario .btn-azul:hover {
    background-color: #0056b3;
  }

  .botones {
    display: flex;
    /* coloca las opciones en línea */
    gap: 20px;
    /* espacio entre Hombre y Mujer */

    align-items: center;
    /* alinea verticalmente */
  }
</style>

</html>
